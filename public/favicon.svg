<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0068FF"/>
      <stop offset="100%" stop-color="#003FA8"/>
    </linearGradient>
    <linearGradient id="hashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0070F3"/>
      <stop offset="100%" stop-color="#0048BA"/>
    </linearGradient>
  </defs>

  <!-- Dark Background with Glowing Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#030712" stroke="url(#borderGrad)" stroke-width="16"/>

  <!-- Centered Stylized Hashtag Group -->
  <g fill="url(#hashGrad)">
    <!-- Vertical slanting bars -->
    <rect x="182" y="80" width="44" height="236" rx="22" transform="rotate(8 204 198)"/>
    <rect x="286" y="80" width="44" height="236" rx="22" transform="rotate(8 308 198)"/>

    <!-- Horizontal slanting bars -->
    <rect x="100" y="136" width="312" height="44" rx="22" transform="rotate(-6 256 158)"/>
    <rect x="100" y="224" width="312" height="44" rx="22" transform="rotate(-6 256 246)"/>
  </g>

  <!-- IG SOCIAL Text -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="url(#hashGrad)" text-anchor="middle" letter-spacing="2">IG SOCIAL</text>
</svg>
